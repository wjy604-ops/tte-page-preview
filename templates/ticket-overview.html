    const moreActive = moreRoot.querySelector("[data-more-active]");
    const moreIdle = moreRoot.querySelector("[data-more-idle]");
    const moreGrip = '<svg class="tte-lucide" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/></svg>';
    const filterField = (key) => document.querySelector(`.ticket-filter[data-filter="${key}"]`);
    const clearHiddenFilter = (key) => {
      if (key in textFilters) {
        textFilters[key] = "";
        const field = filterField(key);
        if (field && !field.classList.contains("is-select")) {
          field.querySelector("input").value = "";
          field.classList.remove("is-filled");
          field.querySelector(".ticket-filter-clear").hidden = true;
        }
      }
      if (key in choiceFilters) {
        choiceFilters[key] = [];
        const field = filterField(key);
        if (field) paintChoice(field);
      }
    };
    const applyMoreFilters = () => {
      moreActiveKeys.forEach((key) => {
        const field = filterField(key);
        if (!field) return;
        field.hidden = false;
        moreRoot.before(field);
      });
      moreIdleKeys.forEach((key) => {
        const field = filterField(key);
        if (field) field.hidden = true;
      });
    };
    const paintMoreMenu = () => {
      moreActive.replaceChildren();
      moreIdle.replaceChildren();
      moreActiveKeys.forEach((key) => moreActive.append(moreItem(key, true)));
      moreIdleKeys.forEach((key) => moreIdle.append(moreItem(key, false)));
    };
    const toggleMoreFilter = (key, on) => {
      if (on) {
        const idleAt = moreIdleKeys.indexOf(key);
        if (idleAt >= 0) moreIdleKeys.splice(idleAt, 1);
        if (!moreActiveKeys.includes(key)) moreActiveKeys.push(key);
      } else {
        const activeAt = moreActiveKeys.indexOf(key);
        if (activeAt >= 0) moreActiveKeys.splice(activeAt, 1);
        if (!moreIdleKeys.includes(key)) moreIdleKeys.push(key);
        clearHiddenFilter(key);
      }
      paintMoreMenu();
      applyMoreFilters();
      applyFilters();
    };
    const bindMoreDrag = (row, grip) => {
      grip.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        event.preventDefault();
        event.stopPropagation();
        const list = moreActive;
        row.classList.add("is-dragging");
        const move = (moveEvent) => {
          const siblings = [...list.children].filter((item) => item !== row);
          const y = moveEvent.clientY;
          const before = siblings.find((item) => {
            const box = item.getBoundingClientRect();
            return y < box.top + box.height / 2;
          });
          if (before) list.insertBefore(row, before);
          else list.append(row);
        };
        const stop = () => {
          row.classList.remove("is-dragging");
          document.removeEventListener("pointermove", move);
          document.removeEventListener("pointerup", stop);
          moreActiveKeys.splice(0, moreActiveKeys.length, ...[...list.children].map((item) => item.dataset.key));
          applyMoreFilters();
        };
        document.addEventListener("pointermove", move);
        document.addEventListener("pointerup", stop);
      });
    };
    const moreItem = (key, checked) => {
      const row = document.createElement("div");
      row.className = "ticket-more-item";
      row.dataset.key = key;
      row.innerHTML = `<label class="tte-checkbox"><input type="checkbox"${checked ? " checked" : ""} aria-label="${FILTER_LABELS[key]}"><span class="checkbox-box" aria-hidden="true"></span><span>${FILTER_LABELS[key]}</span></label>`;
      if (checked) {
        const grip = document.createElement("button");
        grip.type = "button";
        grip.className = "ticket-more-grip";
        grip.setAttribute("aria-label", `拖拽排序 ${FILTER_LABELS[key]}`);
        grip.innerHTML = moreGrip;
        row.append(grip);
        bindMoreDrag(row, grip);
      }
      row.querySelector("input").addEventListener("change", (event) => {
        toggleMoreFilter(key, event.target.checked);
      });
      return row;
    };
    moreRoot.addEventListener("pointerdown", (event) => event.stopPropagation());
    moreTrigger.addEventListener("click", () => {
      const open = moreMenu.hidden;
      closeFilterMenus();
      moreMenu.hidden = !open;
      moreTrigger.setAttribute("aria-expanded", String(open));
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeFilterMenus();
    });
    paintMoreMenu();
    applyMoreFilters();
    document.addEventListener("click", (event) => {
      const follow = event.target.closest("[data-ticket-follow]");
      if (follow) {
        const id = follow.dataset.ticketFollow;
        const on = follow.getAttribute("aria-pressed") !== "true";
        follow.setAttribute("aria-pressed", String(on));
        if (on) followed.add(id);
        else followed.delete(id);
        syncFollowCount();
        if (currentScope() === "followed") {
          page = 1;
          renderRows();
          renderPager();
        }
        return;
      }
      if (!event.target.closest("[data-ticket-clear]")) return;
      Object.keys(textFilters).forEach((key) => { textFilters[key] = ""; });
      Object.keys(choiceFilters).forEach((key) => { choiceFilters[key] = []; });
      document.querySelectorAll(".ticket-filter:not(.is-select)").forEach((field) => {
        field.querySelector("input").value = "";
        field.classList.remove("is-filled");
        field.querySelector(".ticket-filter-clear").hidden = true;
      });
      document.querySelectorAll(".ticket-filter.is-select").forEach(paintChoice);
      closeFilterMenus();
      applyFilters();
    });
    mountIcons();
    selectMorph = globalThis.TTEMorphicons.createMorph(selectAllButton.querySelector("path"), selectAllOn ? SELECT_CLEAR : SELECT_CHECK);
    document.addEventListener("pointerdown", () => {
      closeFilterMenus();
      document.querySelectorAll(".ticket-pager .dropdown-menu").forEach((menu) => {
        menu.hidden = true;
        menu.classList.remove("is-drop-up");
      });
      document.querySelectorAll(".ticket-pager .tte-select-trigger").forEach((trigger) => trigger.setAttribute("aria-expanded", "false"));
    });
    renderRows();
    renderPager();
    selectAllButton.addEventListener("click", () => {
      const boxes = [...document.querySelectorAll("[data-ticket-row]")];
      const next = boxes.length > 0 && !boxes.every((box) => box.checked);
      boxes.forEach((box) => { box.checked = next; });
      syncSelectAll(true);
    });
    document.querySelectorAll(".ticket-scope").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".ticket-scope").forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
        page = 1;
        renderRows();
        renderPager();
      });
    });
    document.addEventListener("pointerover", (event) => {
      const button = event.target.closest(".ticket-action-icon");
      if (button) showActionTip(button);
    });
    document.addEventListener("pointerout", (event) => {
      const button = event.target.closest(".ticket-action-icon");
      if (button && !button.contains(event.relatedTarget)) hideActionTip();
    });
    const scroll = document.querySelector("[data-table]");
    const followHeadMenus = () => {
      document.querySelectorAll("[data-head-menu]").forEach((menu) => {
        if (menu.hidden) return;
        const trigger = document.querySelector(`[data-head-filter="${menu.dataset.headMenu}"]`);
        if (trigger) placeHeadMenu(trigger, menu);
      });
    };
    scroll.addEventListener("scroll", followHeadMenus, { passive: true });
    window.addEventListener("scroll", followHeadMenus, true);
    const ping = () => {
      scroll.classList.toggle("is-ping-left", scroll.scrollLeft > 1);
      scroll.classList.toggle("is-ping-right", scroll.scrollWidth - scroll.clientWidth - scroll.scrollLeft > 1);
      scroll.style.setProperty("--ticket-empty-width", `${scroll.clientWidth}px`);
    };
    const hbar = document.querySelector(".ticket-scroll-x");
    const hthumb = hbar.querySelector("i");
    const placeHorizontal = () => {
      const overflow = scroll.scrollWidth - scroll.clientWidth;
      if (overflow <= 1) {
        hbar.hidden = true;
        return;
      }
      hbar.hidden = false;
      const track = hbar.clientWidth || Math.max(0, scroll.clientWidth - 8);
      const size = Math.max(24, Math.min(track, Math.round(track * scroll.clientWidth / scroll.scrollWidth)));
      const offset = (scroll.scrollLeft / overflow) * (track - size);
      hthumb.style.width = `${size}px`;
      hthumb.style.left = `${offset}px`;
      hbar.hidden = false;
    };
    window.TTEScrollThumb.enable(hthumb, {
      axis: "x",
      metrics() {
        const overflow = scroll.scrollWidth - scroll.clientWidth;
        const track = hbar.clientWidth || Math.max(0, scroll.clientWidth - 8);
        const size = Math.max(24, Math.min(track, Math.round(track * scroll.clientWidth / Math.max(scroll.scrollWidth, 1))));
        return { overflow, travel: Math.max(1, track - size), scroll: scroll.scrollLeft };
      },
      setScroll(value) { scroll.scrollLeft = value; },
      place: placeHorizontal
    });
    scroll.addEventListener("scroll", () => { hideActionTip(); ping(); placeHorizontal(); }, { passive: true });
    window.addEventListener("resize", () => { hideActionTip(); ping(); placeHorizontal(); });
    ping();
    placeHorizontal();
    const pageScroll = document.querySelector(".app-column > .tte-sidebar-inset");
    const thumb = document.createElement("div");
    thumb.className = "ticket-scroll-thumb";
    thumb.setAttribute("aria-hidden", "true");
    document.body.append(thumb);
    let hideTimer = 0;
    const placePageThumb = () => {
      const rect = pageScroll.getBoundingClientRect();
      const style = getComputedStyle(pageScroll);
      const borderTop = parseFloat(style.borderTopWidth) || 0;
      const borderRight = parseFloat(style.borderRightWidth) || 0;
      const borderBottom = parseFloat(style.borderBottomWidth) || 0;
      const inset = 4;
      const overflow = pageScroll.scrollHeight - pageScroll.clientHeight;
      if (overflow <= 1 || rect.height < 12) {
        thumb.classList.remove("is-on");
        return false;
      }
      const track = Math.max(0, rect.height - borderTop - borderBottom - inset * 2);
      const size = Math.max(24, Math.min(track, Math.round(track * pageScroll.clientHeight / pageScroll.scrollHeight)));
      const offset = inset + (pageScroll.scrollTop / overflow) * (track - size);
      thumb.style.height = `${size}px`;
      thumb.style.left = `${rect.right - borderRight - inset - 4}px`;
      thumb.style.top = `${rect.top + borderTop + offset}px`;
      return true;
    };
    let pageGrip;
    pageGrip = window.TTEScrollThumb.enable(thumb, {
      axis: "y",
      metrics() {
        const style = getComputedStyle(pageScroll);
        const borderTop = parseFloat(style.borderTopWidth) || 0;
        const borderBottom = parseFloat(style.borderBottomWidth) || 0;
        const inset = 4;
        const overflow = pageScroll.scrollHeight - pageScroll.clientHeight;
        const track = Math.max(0, pageScroll.getBoundingClientRect().height - borderTop - borderBottom - inset * 2);
        const size = Math.max(24, Math.min(track, Math.round(track * pageScroll.clientHeight / Math.max(pageScroll.scrollHeight, 1))));
        return { overflow, travel: Math.max(1, track - size), scroll: pageScroll.scrollTop };
      },
      setScroll(value) { pageScroll.scrollTop = value; },
      place: placePageThumb,
      hold(active) {
        if (active) {
          clearTimeout(hideTimer);
          thumb.classList.add("is-on");
        } else {
          clearTimeout(hideTimer);
          hideTimer = setTimeout(() => { if (!pageGrip.busy()) thumb.classList.remove("is-on"); }, 1000);
        }
      }
    });
    const showPageThumb = () => {
      if (!placePageThumb()) return;
      thumb.classList.add("is-on");
      if (pageGrip.busy()) return;
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => { if (!pageGrip.busy()) thumb.classList.remove("is-on"); }, 1000);
    };
    pageScroll.addEventListener("scroll", () => { hideActionTip(); showPageThumb(); }, { passive: true });
    pageScroll.addEventListener("pointerleave", (event) => {
      if (pageGrip.busy() || event.relatedTarget === thumb) return;
      clearTimeout(hideTimer);
      thumb.classList.remove("is-on");
    });
    window.addEventListener("resize", () => { if (thumb.classList.contains("is-on")) placePageThumb(); });
  </script>
  <script src="sidebar-icons.js"></script>
  <script src="shell.js"></script>
</body>
