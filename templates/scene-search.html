              <button class="tte-select-option" type="button" role="option" data-filter-field="source" aria-selected="true">数据来源</button>

              <button class="tte-select-option" type="button" role="option" data-filter-field="time" aria-selected="false">创建时间</button>
            </div>
          </div>
        </div>
        <div class="tte-field">
          <label class="tte-field-label" for="filter-op">条件</label>
          <div class="tte-select-control" data-select>
            <button class="tte-select-trigger" type="button" data-select-trigger aria-expanded="false" aria-haspopup="listbox" id="filter-op"><span class="tte-select-value" data-select-value>包含</span><svg class="tte-lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
            <div class="tte-select-menu" data-select-menu role="listbox" hidden>
              <button class="tte-select-option" type="button" role="option" data-filter-op="contains" aria-selected="true">包含</button>
              <button class="tte-select-option" type="button" role="option" data-filter-op="equals" aria-selected="false">等于</button>
              <button class="tte-select-option" type="button" role="option" data-filter-op="prefix" aria-selected="false">前缀等于</button>
            </div>
          </div>
        </div>
        <div class="tte-field">
          <label class="tte-field-label" for="filter-value">筛选值</label>
          <input class="tte-input" id="filter-value" type="text" placeholder="请输入筛选值" data-filter-value>
          <p class="tte-field-error" data-filter-error hidden>请输入筛选值</p>
        </div>
        <div class="tte-field">
          <label class="tte-field-label" for="filter-name">存为常用时的名称</label>
          <input class="tte-input" id="filter-name" type="text" placeholder="例如 雨夜量产" data-filter-name>
        </div>
      </div>
      <div class="tte-popup-footer">
        <button class="tte-button tte-button-secondary tte-button-md" type="button" data-popup-close>取消</button>
        <button class="tte-button tte-button-secondary tte-button-md" type="button" data-save-filter>存为常用筛选</button>
        <button class="tte-button tte-button-primary tte-button-md" type="button" data-apply-filter>应用筛选</button>
      </div>
    </div>
  </div>

  <div class="tte-popup" id="popup-scalar" data-popup hidden>
    <button class="tte-popup-mask" type="button" data-popup-close aria-label="关闭弹窗"></button>
    <div class="tte-popup-panel is-form" role="dialog" aria-modal="true" aria-labelledby="popup-scalar-title" tabindex="-1">
      <div class="tte-popup-head">
        <h2 class="tte-popup-title" id="popup-scalar-title">标量条件</h2>
        <button class="tte-button tte-button-icon-only tte-button-sm" type="button" data-popup-close aria-label="关闭"><svg class="tte-lucide button-icon-only" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="tte-popup-form">
        <div class="tte-field">
          <label class="tte-field-label" for="scalar-speed">自车速度不低于</label>
          <input class="tte-input" id="scalar-speed" type="number" min="0" value="0" data-scalar-speed>
        </div>
        <div class="tte-field">
          <label class="tte-field-label" for="scalar-duration">片段时长不低于（秒）</label>
          <input class="tte-input" id="scalar-duration" type="number" min="0" value="0" data-scalar-duration>
        </div>
      </div>
      <div class="tte-popup-footer">
        <button class="tte-button tte-button-secondary tte-button-md" type="button" data-popup-close>取消</button>
        <button class="tte-button tte-button-primary tte-button-md" type="button" data-apply-scalar>应用</button>
      </div>
    </div>
  </div>

  <div class="tte-popup" id="popup-preview" data-popup hidden>
    <button class="tte-popup-mask" type="button" data-popup-close aria-label="关闭弹窗"></button>
    <div class="tte-popup-panel" role="dialog" aria-modal="true" aria-labelledby="popup-preview-title" tabindex="-1">
      <div class="tte-popup-head">
        <h2 class="tte-popup-title" id="popup-preview-title">预览</h2>
        <button class="tte-button tte-button-icon-only tte-button-sm" type="button" data-popup-close aria-label="关闭"><svg class="tte-lucide button-icon-only" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <p class="tte-popup-copy" data-preview-copy></p>
      <div class="tte-popup-footer">
        <button class="tte-button tte-button-primary tte-button-md" type="button" data-popup-close>知道了</button>
      </div>
    </div>
  </div>

  <div class="tte-drawer" id="drawer-detail" data-drawer hidden>
    <button class="tte-drawer-mask" type="button" data-drawer-close aria-label="关闭抽屉"></button>
    <div class="tte-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-detail-title" tabindex="-1">
      <div class="tte-drawer-head">
        <h2 class="tte-drawer-title" id="drawer-detail-title">片段详情</h2>
        <button class="tte-button tte-button-icon-only tte-button-sm" type="button" data-drawer-close aria-label="关闭"><svg class="tte-lucide button-icon-only" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="scene-detail" data-detail></div>
      <div class="tte-drawer-footer">
        <button class="tte-button tte-button-secondary tte-button-md" type="button" data-drawer-close>关闭</button>
        <button class="tte-button tte-button-primary tte-button-md" type="button" data-detail-download>下载</button>
      </div>
    </div>
  </div>

  <div class="tte-message-viewport" data-messages aria-live="polite"></div>
  <script src="sidebar-icons.js"></script>
  <script src="shell.js"></script>
  <script src="scene-search.js"></script>
</body>
</html>
